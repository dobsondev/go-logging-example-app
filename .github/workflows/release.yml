name: Build and Push Release Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml

  build-and-push-image:
    uses: ./.github/workflows/_build-and-push-image.yml
    needs: [ci]

  argocd-gitops:
    name: ArgoCD GitOps
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: dobsondev/homelab
          path: homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}

      - name: Update ArgoCD Application Manifest
        working-directory: homelab/argocd/helm/values
        run: |
          yq e '.image.tag = "${{ needs.build-and-push-image.outputs.image-tag }}"' -i ${{ github.event.repository.name }}.yml

      - name: Commit and Push
        working-directory: homelab/argocd/helm/values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.HOMELAB_REPO_TOKEN }}@github.com/dobsondev/homelab.git
          git add ${{ github.event.repository.name }}.yml
          git commit -m "automated(${{ github.event.repository.name }}): update image tag to ${{ needs.build-and-push-image.outputs.image-tag }}"
          git push

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes
