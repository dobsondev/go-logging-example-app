name: Build and Push Release Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Extract Metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  argocd-gitops:
    name: ArgoCD GitOps
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: dobsondev/homelab
          path: homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}

      - name: Update ArgoCD Application Manifest
        working-directory: homelab/argocd/helm/values
        run: |
          yq e '.image.tag = "${{ needs.build-and-push-image.outputs.image-tag }}"' -i ${{ github.repository }}.yml

      - name: Commit and Push
        working-directory: homelab/argocd/helm/values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.HOMELAB_REPO_TOKEN }}@github.com/dobsondev/homelab.git
          git add ${{ github.repository }}.yml
          git commit -m "automated(${{ github.repository }}): update image tag to ${{ needs.build-and-push-image.outputs.image-tag }} [skip ci]"
          git push

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes