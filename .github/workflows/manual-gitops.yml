name: Manual GitOps Deployment

on:
  workflow_dispatch:
    inputs:
      docker-image-tag:
        description: 'Docker Image Tag to Deloy via ArgoCD'
        required: true
        default: 'v0.0.1'

jobs:
  check-image:
    name: Check Docker Image Exists
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Image Exists in GitHub Container Registry
        run: |
          docker manifest inspect ghcr.io/${{ github.repository }}:${{ inputs.docker-image-tag }}
    
  argocd-gitops:
    needs: [check-image]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_argocd-gitops.yml
    secrets: inherit
    with:
      docker-image-tag: ${{ inputs.docker-image-tag }}