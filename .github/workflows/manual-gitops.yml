name: Manual GitOps Deployment

on:
  workflow_dispatch:
    inputs:
      docker-image-tag:
        description: 'Docker Image Tag to Deloy via ArgoCD'
        required: true
        default: 'v0.0.1'

jobs:
  check-image:
    name: Check Docker Image Exists
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Image Exists in GitHub Container Registry
        run: |
          docker manifest inspect ghcr.io/${{ github.repository }}:${{ inputs.docker-image-tag }}
    
  argocd-gitops:
    name: ArgoCD GitOps
    runs-on: ubuntu-latest
    needs: [check-image]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: dobsondev/homelab
          path: homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}

      - name: Update ArgoCD Application Manifest
        working-directory: homelab/argocd/helm/values
        run: |
          yq e '.image.tag = "${{ inputs.docker-image-tag }}"' -i ${{ github.event.repository.name }}.yml

      - name: Commit and Push
        working-directory: homelab/argocd/helm/values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.HOMELAB_REPO_TOKEN }}@github.com/dobsondev/homelab.git
          git add ${{ github.event.repository.name }}.yml
          git commit -m "automated(${{ github.event.repository.name }}): update image tag to ${{ inputs.docker-image-tag }}"
          git push