name: Continuous Deployment

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.air.toml'
      - '.gitignore'
      - 'docker-compose.yml'
      - 'README.md'

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml

  release-check:
    name: Check for Release
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # https://github.com/semantic-release/semantic-release/blob/master/docs/recipes/ci-configurations/github-actions.md
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Check Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release --dry-run 2>&1)
          echo "$OUTPUT"
          
          if echo "$OUTPUT" | grep -q "The next release version is"; then
            VERSION=$(echo "$OUTPUT" | grep "The next release version is" | sed 's/.*The next release version is //')
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=" >> $GITHUB_OUTPUT
          fi

  build-and-push-image-sha:
    name: Build and Push SHA Image
    uses: ./.github/workflows/_build-and-push-image.yml
    needs: [ci, release-check]
    if: needs.release-check.outputs.new_release_published != 'true'
    permissions:
      contents: read
      attestations: write
      packages: write
      id-token: write
    with:
      tags: |
        type=sha,format=short,prefix=
        type=raw,value=latest

  build-and-push-image-release:
    name: Build and Push Release Image
    uses: ./.github/workflows/_build-and-push-image.yml
    needs: [ci, release-check]
    if: needs.release-check.outputs.new_release_published == 'true'
    permissions:
      contents: read
      attestations: write
      packages: write
      id-token: write
    with:
      tags: |
        type=raw,value=v${{ needs.release-check.outputs.new_release_version }}
        type=sha,format=short,prefix=
        type=raw,value=latest

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-push-image-release, release-check]
    if: needs.release-check.outputs.new_release_published == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # https://github.com/semantic-release/semantic-release/blob/master/docs/recipes/ci-configurations/github-actions.md
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  argocd-gitops:
    needs: [build-and-push-image-release, release]
    if: needs.release-check.outputs.new_release_published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_argocd-gitops.yml
    secrets: inherit
    with:
      docker-image-tag: ${{ needs.build-and-push-image-release.outputs.image-tag }}