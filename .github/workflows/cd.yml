name: Continuous Deployment

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml

  release-check:
    name: Check for Release
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Check Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run
          echo "new_release_published=${NEW_RELEASE_PUBLISHED}" >> $GITHUB_OUTPUT
          echo "new_release_version=${NEW_RELEASE_VERSION}" >> $GITHUB_OUTPUT

  build-and-push-image-sha:
    name: Build and Push SHA Image
    uses: ./.github/workflows/_build-and-push-image.yml
    needs: [ci, release-check]
    if: needs.release-check.outputs.new_release_published != 'true'
    with:
      tags: |
        type=sha,format=short,prefix=
        type=raw,value=latest

  build-and-push-image-release:
    name: Build and Push Release Image
    uses: ./.github/workflows/_build-and-push-image.yml
    needs: [ci, release-check]
    if: needs.release-check.outputs.new_release_published == 'true'
    with:
      tags: |
        type=sha,format=short,prefix=
        type=raw,value=latest
        type=semver,pattern={{version}},value=v${{ needs.release-check.outputs.new_release_version }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-push-image-release, release-check]
    if: needs.release-check.outputs.new_release_published == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  argocd-gitops:
    name: ArgoCD GitOps
    runs-on: ubuntu-latest
    needs: [build-and-push-image-release, release]
    if: needs.release-check.outputs.new_release_published == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: dobsondev/homelab
          path: homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}

      - name: Update ArgoCD Application Manifest
        working-directory: homelab/argocd/helm/values
        run: |
          yq e '.image.tag = "${{ needs.build-and-push-image-release.outputs.image-tag }}"' -i ${{ github.event.repository.name }}.yml

      - name: Commit and Push
        working-directory: homelab/argocd/helm/values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.HOMELAB_REPO_TOKEN }}@github.com/dobsondev/homelab.git
          git add ${{ github.event.repository.name }}.yml
          git commit -m "automated(${{ github.event.repository.name }}): update image tag to ${{ needs.build-and-push-image-release.outputs.image-tag }}"
          git push
